services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://supportops:supportops_dev_password@db:5432/supportops
      JWT_SECRET_KEY: local-docker-only-change-before-deploy
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: supportops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - supportops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportops -d supportops"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  supportops_pgdata:
